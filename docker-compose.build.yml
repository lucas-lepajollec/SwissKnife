# Construction locale depuis ce dépôt (contributeurs).
# Usage : docker compose -f docker-compose.build.yml up -d --build

services:
  swissknife:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_TITLE: SwissKnife
    container_name: swissknife
    ports:
      - "2501:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
