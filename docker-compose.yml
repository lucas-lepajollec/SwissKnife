# Image GHCR publiée — à utiliser en homelab / NAS.
# Pour construire depuis les sources : docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  swissknife:
    image: ${SWISSKNIFE_IMAGE:-ghcr.io/lucas-lepajollec/swissknife:latest}
    container_name: swissknife
    ports:
      - "2501:2501"
    restart: unless-stopped
